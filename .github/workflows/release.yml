name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  tag-release:
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - id: check
        run: |
          set -e
          # Only source and package files should bump version or cut a release.
          # Docs, README, CI config, licenses, etc. are ignored.
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD^ HEAD)
          else
            CHANGED=$(git show --pretty="" --name-only HEAD)
          fi

          is_release_relevant() {
            case "$1" in
              package.json|package-lock.json|bun.lock|bun.lockb|yarn.lock|pnpm-lock.yaml)
                return 0
                ;;
              *.js|*.mjs|*.cjs|*.ts|*.tsx)
                return 0
                ;;
            esac
            return 1
          }

          SHOULD_RELEASE=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if is_release_relevant "$file"; then
              SHOULD_RELEASE=true
              break
            fi
          done <<< "$CHANGED"

          if [ "$SHOULD_RELEASE" = true ]; then
            echo "Release-relevant files changed"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs/metadata changed; skipping version bump and release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version if unchanged
        id: version
        if: steps.check.outputs.should_release == 'true'
        run: |
          set -e
          CURRENT=$(jq -r .version package.json)
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            OLD=$(git show HEAD^:package.json | jq -r .version)
          else
            OLD=""
          fi

          if [ -n "$OLD" ] && [ "$OLD" = "$CURRENT" ]; then
            npm version patch --no-git-tag-version
            CURRENT=$(jq -r .version package.json)
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json
            for lock in package-lock.json bun.lock bun.lockb yarn.lock; do
              if [ -f "$lock" ]; then git add "$lock"; fi
            done
            git commit -m "chore: bump version to ${CURRENT}"
            git push
            echo "Auto-bumped version to ${CURRENT}"
          else
            echo "Using version ${CURRENT} (already bumped or initial)"
          fi

          echo "version=${CURRENT}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        if: steps.check.outputs.should_release == 'true'
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s" -10)
          else
            COMMITS=$(git log --pretty=format:"- %s" ${LAST_TAG}..HEAD)
          fi
          echo "commits<<EOF" >> "$GITHUB_OUTPUT"
          echo "$COMMITS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create tag and release
        if: steps.check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: false
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.commits }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
